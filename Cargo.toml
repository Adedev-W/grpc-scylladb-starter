[package]
name = "rpc-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
serde_json = "1.0.151"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
[build-dependencies]
tonic-prost-build = "0.14.6"

